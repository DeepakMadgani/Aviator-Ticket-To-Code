# docker-compose for optional Neo4j + Qdrant backends.
#
# Default storage is SQLite (no Docker needed). Start these only when you
# enable the corresponding `[neo4j]` / `[qdrant]` extras:
#
#   docker compose -f docker-compose.yml up -d neo4j qdrant
#
services:
  neo4j:
    image: neo4j:5.20-community
    container_name: aviator-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/aviator-dev
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.7
    container_name: aviator-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
