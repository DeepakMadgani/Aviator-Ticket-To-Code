# Kubernetes Secret Provider Configuration
# This profile configures Aviator to use Kubernetes secrets instead of environment variables

config:
  # Enable Kubernetes secrets manager
  SECRETS_MANAGER: kubernetes
  # Kubernetes configuration (JSON string) - namespace will be overridden by deployment namespace
  KUBERNETES_CONFIG: '{"endpoint": "https://kubernetes.default.svc", "timeout": 60}'
  
  # Set the broker credentials to match RabbitMQ configuration
  BROKER_USER: "user"
  BROKER_PASSWORD: "secretpassword"
  
  # Specify which secret keys to use for various passwords
  # Format: secret-name::field-name
  SECRETS_PGVECTOR_PASSWORD_KEY: "aviator-keys::POSTGRES_PASSWORD"
  SECRETS_BROKER_PASSWORD_KEY: "aviator-keys::BROKER_PASSWORD"
  
  # Standard database configuration
  POSTGRES_CONNECTION: ''
  POSTGRES_HOST: "aviator-backend-pgvector"
  POSTGRES_USER: "postgres"
  POSTGRES_DATABASE: "postgres"
  POSTGRES_PORT: "5432"
  
# Enable RBAC so pods can access secrets
rbac:
  create: true
  # You can customize rules here if needed
  rules:
    - apiGroups: [""]
      resources: ["secrets", "configmaps"]  
      verbs: ["get", "list"]

# Enable service accounts with proper naming
serviceAccount:
  enabled: true
  app:
    name: "aviator-app"
  worker:
    name: "aviator-worker"