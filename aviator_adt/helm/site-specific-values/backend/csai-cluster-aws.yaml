pgvector:
  image:
    repository: 028791545937.dkr.ecr.us-west-2.amazonaws.com/csai/pgvector
    tag: v0.5.0
  imagePullSecrets: 
    - name: azure-acr-credentials
  resources:
    limits:
      cpu: 1
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 2Gi
  persistence:
    storageClassName: gp2
    enabled: enabled
  secrets:
    POSTGRES_PASSWORD: "1-TERRIBLE-password!"

rabbitmq:
  image:
    repository: 028791545937.dkr.ecr.us-west-2.amazonaws.com/csai/rabbitmq
    tag: 4.0.6-management
  persistence:
    storageClass: gp2
    enabled: enabled

pubsub:
  enabled: false