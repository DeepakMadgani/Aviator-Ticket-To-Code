  config:
    PROXY_SERVER: http://saas-proxy-service:3333
    PROXY_AUTH_CREDENTIALS_KEY: 'PROXY_AUTH_CREDENTIALS'
    CONTENT_SYSTEM: xecm
    CONTENT_SYSTEM_AUTH_URL: http://otds/otdsws
  proxyServerSecretName: saas-proxy-service-secret
  ingress:
