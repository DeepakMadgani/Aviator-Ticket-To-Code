# =============================================================================
# MIGRATION JOB (CSAI → ADT vector store migration)
# =============================================================================
# Architecture: ID-based migration
# - Producer reads all row IDs from source and publishes batches of IDs to the queue
# - Workers fetch full rows from source DB using WHERE id IN (...)
# - Workers group rows by tenant schema and insert into target DB
# - This keeps queue messages small (no embeddings) and distributes source DB load
# - Each batch targets specific IDs, making it deterministic and resumable
#
# IMPORTANT: Both the producer AND workers need source DB access. Set source
# DB credentials in migration.config (non-sensitive) and migration.secrets (sensitive).
# These are automatically propagated to workers via the shared configmap/secrets.
# =============================================================================
migration:
  # -- Enable the migration Job (runs the migration producer to completion)
  # When true, a Kubernetes Job is created that runs the migration producer,
  # and the worker automatically subscribes to the migration queue.
  # Workers also receive source DB credentials to fetch rows directly.
  # Check job status: kubectl get jobs -l app=aviator-migration
  # View logs: kubectl logs job/aviator-migration
  enabled: false
  # -- Migration job runtime mode: `migration` (chunk/index migration) or `summary-backfill`.
  # Set to `summary-backfill` to run the summary backfill producer with the same Job template.
  mode: migration
  # -- Number of retries before the Job is considered failed
  backoffLimit: 3
  # -- Maximum time the Job is allowed to run (null for no limit)
  activeDeadlineSeconds:
  # -- Seconds after completion before the Job is auto-deleted (default: 24h, null to keep forever).
  # Allows time to inspect logs before cleanup.
  ttlSecondsAfterFinished: 86400
  # -- Additional pod annotations
  # @default -- {}
  annotations: {}
  # -- Container image for the migration Job (falls back to default image)
  image:
    repository:
    name:
    tag:
    pullPolicy:
  # -- Resource requests and limits for the migration producer container
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  # -- Migration-specific environment variables (non-sensitive, set on Job AND workers)
  # These are added to the shared ConfigMap when migration is enabled.
  # @default -- {}
  config:
    MIGRATION_SOURCE_TABLE: "test1"
    # MIGRATION_SOURCE_SCHEMA: ""
    # MIGRATION_BATCH_SIZE: "500"  # IDs per batch message
    # MIGRATION_DRY_RUN: ""
    # MIGRATION_DEFER_INDEXES: ""
    # MIGRATION_LOG_LEVEL: ""
    # MIGRATION_STRIP_TENANT_FROM_META: ""
    # MIGRATION_MIGRATION_QUEUE: ""
    # MIGRATION_SUMMARY_BATCH_SIZE: "10"
    # MIGRATION_SUMMARY_QUEUE: "aviator-summaries"
    # -- Source DB via individual components (alternative to MIGRATION_SOURCE_DSN).
    # -- When MIGRATION_SOURCE_DSN is set in secrets, these are ignored.
    # MIGRATION_SOURCE_HOST: ""
    # MIGRATION_SOURCE_PORT: "5432"
    # MIGRATION_SOURCE_USER: "postgres"
    # MIGRATION_SOURCE_DATABASE: "postgres"
    # -- Google Secret Manager key for source DB password (requires SECRETS_MANAGER=google)
    # MIGRATION_SOURCE_PASSWORD_KEY: "projects/<project>/secrets/<name>/versions/latest"
  # -- Migration secrets (sensitive values, set on Job AND workers)
  # These are added to a Secret and mounted to both producer and workers.
  # Either provide a full DSN, or individual source password (when using source component fields)
  secrets:
    # -- Create the migration secrets resource
    create: true
    # -- Name of the Kubernetes secret for migration
    name: aviator-migration-secrets
    # -- Key-value pairs for secret data
    # @default -- {}
    items: {
      # MIGRATION_SOURCE_DSN: "postgresql://postgres:postgres@source_db:5432/CSAI"
    }

# =============================================================================
# SUMMARY MIGRATION JOB (document summary backfill — runs after chunk migration)
# =============================================================================
# Prerequisites for summary backfill:
# 1. Chunk migration job MUST complete successfully (migration.enabled=true first)
# 2. Worker deployment MUST have MIGRATION_ENABLED=true to consume summary tasks
# 3. Source and target databases must both be accessible
# 4. LLM credentials must be configured (LLM_PROVIDER=google_genai or openai)
# 5. Message broker (RabbitMQ/Redis/Pub/Sub) must be available for producer→worker communication
# 6. Embeddings service must be available for title embeddings generation
#
# Typical deployment sequence:
# 1. Deploy worker with MIGRATION_ENABLED=true (global config or via initContainers)
# 2. Run chunk migration: migration.enabled=true
# 3. Wait for chunk migration to complete
# 4. Run summary backfill: summaryMigration.enabled=true
summaryMigration:
  # -- Enable the summary backfill Job.
  # Run this after the chunk migration job has completed successfully.
  # Note: Requires worker to have MIGRATION_ENABLED=true to register summary consumer tasks.
  enabled: false
  # -- When true, an init container polls the migration_state table until chunk migration
  # (id=csai_to_adt) reaches status=completed before starting the summary producer.
  # If chunk migration is still running or failed, init container will retry indefinitely.
  # Set activeDeadlineSeconds or use waitForMigration=false to prevent infinite waiting.
  # Requires POSTGRES_HOST/USER/DATABASE in the shared configmap and POSTGRES_PASSWORD in secrets.
  waitForMigration: true
  # -- Image used by the wait init container. Must include the psql CLI.
  waitImage: postgres:16-alpine
  # -- Number of retries before the Job is considered failed.
  backoffLimit: 3
  # -- Seconds after completion before the Job is auto-deleted (default: 24h, null to keep forever).
  ttlSecondsAfterFinished: 86400
  # -- Maximum time the Job is allowed to run in seconds (null for no limit).
  # Recommended: Set this if using waitForMigration=true to prevent init container from hanging indefinitely.
  activeDeadlineSeconds:
  # -- Additional pod annotations.
  # @default -- {}
  annotations: {}
  # -- Container image for the summary migration Job (falls back to default image).
  image:
    repository:
    name:
    tag:
    pullPolicy:
  # -- Resource requests and limits. Summary generation is LLM-heavy; tune accordingly.
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  # -- Non-sensitive environment variables for the summary backfill producer.
  # Note: MIGRATION_ENABLED=true is automatically set by the job template.
  # @default -- {}
  config:
    # MIGRATION_SUMMARY_BATCH_SIZE: "10"
    # MIGRATION_SUMMARY_QUEUE: "csai-adt-summary"
    # MIGRATION_DRY_RUN: ""
    # MIGRATION_LOG_LEVEL: ""
    # -- Source DB connection (summary producer reads chunks from source to generate summaries).
    # -- Use MIGRATION_SOURCE_DSN for a full connection string, or individual components below.
    # MIGRATION_SOURCE_TABLE: ""
    # MIGRATION_SOURCE_SCHEMA: ""
    # MIGRATION_SOURCE_HOST: ""
    # MIGRATION_SOURCE_PORT: "5432"
    # MIGRATION_SOURCE_USER: "postgres"
    # MIGRATION_SOURCE_DATABASE: "postgres"
    # MIGRATION_SOURCE_PASSWORD_KEY: "projects/<project>/secrets/<name>/versions/latest"
  # -- Sensitive values (source DSN or source DB password).
  secrets:
    # -- Create the summary migration secrets resource.
    create: false
    # -- Name of the Kubernetes secret.
    name: aviator-summary-migration-secrets
    # -- Key-value pairs for secret data.
    # @default -- {}
    items: {
      # MIGRATION_SOURCE_DSN: "postgresql://postgres:postgres@source_db:5432/CSAI"
    }

