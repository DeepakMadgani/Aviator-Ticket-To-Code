# Default values for aviator chart

# =============================================================================
# DEFAULT CONFIGURATIONS
# =============================================================================
# -- Default container image configuration (used as fallback if not specified in app/worker)
image:
  # -- Default container image repository
  # Override this with your own registry and image path via site-specific values
  repository: ""
  # -- Default container image name
  name: aviator
  # -- Default container image tag
  tag: latest
  # -- Default image pull policy (Always, IfNotPresent, Never)
  pullPolicy: Always

# =============================================================================
# APP CONFIGURATION
# =============================================================================

app:
  # -- Enable or disable the main application deployment
  enabled: true
  # -- Name of the application
  name: aviator
  # -- Number of replicas for the application (ignored if autoscaling is enabled)
  replicaCount: 1
  # -- Container port the application listens on
  port: 3000
  # -- Pod security context configuration
  securityContext:
    # -- Enable pod security context
    enabled: true
    # -- User ID to run the container as
    runAsUser: 1000
    # -- Group ID to run the container as
    runAsGroup: 1000
    # -- Filesystem group ID
    fsGroup: 1000
  tolerations: []
  annotations: {}
  # -- Number of Gunicorn worker threads
  threads: 4
  # -- Container image configuration for the application
  image:
    # -- Container image repository
    repository:
    # -- Container image name
    name:
    # -- Container image tag
    tag:
    # -- Image pull policy (Always, IfNotPresent, Never)
    pullPolicy:
  # -- Resource requests and limits for the application container
  resources:
    limits:
      # -- CPU limit
      cpu: "2000m"
      # -- Memory limit
      memory: "512Mi"
    requests:
      # -- CPU request
      cpu: "100m"
      # -- Memory request
      memory: "512Mi"
  # -- Service configuration for the application
  service:
    # -- Kubernetes service type (ClusterIP, NodePort, LoadBalancer)
    type: ClusterIP
    # -- Service port (external-facing port on the K8s Service)
    port: 80
  # -- Ingress configuration for external access
  ingress:
    # -- Enable ingress resource
    enabled: false
    # -- Ingress class name (e.g., nginx, traefik)
    ingressClassName: nginx
    # -- Ingress hosts configuration
    # @default -- []
    hosts: []
      # - host: aviator.example.com
      #   paths:
      #     - path: /
      #       pathType: ImplementationSpecific
    # -- TLS configuration for ingress
    # @default -- []
    tls: []
      # - secretName: aviator-tls
      #   hosts:
      #     - aviator.example.com
    # -- Additional ingress annotations
    # @default -- {}
    annotations: {}
      # ingress.kubernetes.io/force-hsts: "true"
      # ingress.kubernetes.io/hsts-max-age: "15552000"
      # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  # -- Deployment strategy configuration
  strategy:
    # -- Deployment strategy type (RollingUpdate, Recreate)
    type: RollingUpdate
    # -- Rolling update configuration
    rollingUpdate:
      # -- Maximum number of unavailable pods during update
      maxUnavailable: 0
      # -- Maximum number of pods that can be created above desired count
      maxSurge: 1
  # -- Horizontal Pod Autoscaler configuration
  autoscaling:
    # -- Enable autoscaling for the application
    enabled: false
    # -- Minimum number of replicas
    minReplicas: 1
    # -- Maximum number of replicas
    maxReplicas: 100
    # -- Target CPU utilization percentage for autoscaling
    targetCPUUtilizationPercentage: 80
    # -- Target memory utilization percentage for autoscaling (optional)
    # targetMemoryUtilizationPercentage: 80
  # -- Probe configuration for the application container
  probes:
    # -- Readiness probe configuration
    readiness:
      # -- Enable readiness probe
      enabled: true
      # -- Seconds before starting readiness probe
      initialDelaySeconds: 5
      # -- How often to perform the probe
      periodSeconds: 10
      # -- Probe timeout in seconds
      timeoutSeconds: 3
      # -- Number of failures before marking unhealthy
      failureThreshold: 3
    # -- Liveness probe configuration
    liveness:
      # -- Enable liveness probe
      enabled: true
      # -- Seconds before starting liveness probe
      initialDelaySeconds: 30
      # -- How often to perform the probe
      periodSeconds: 60
      # -- Probe timeout in seconds
      timeoutSeconds: 3
      # -- Number of failures before restarting container
      failureThreshold: 3
    # -- Startup probe configuration
    startup:
      # -- Enable startup probe
      enabled: true
      # -- Seconds before starting startup probe
      initialDelaySeconds: 10
      # -- How often to perform the probe
      periodSeconds: 10
      # -- Probe timeout in seconds
      timeoutSeconds: 3
      # -- Number of failures before killing container
      failureThreshold: 30
  # -- Prometheus metrics configuration
  prometheus:
    # -- Enable Prometheus metrics scraping
    enabled: true
    # -- Prometheus scrape annotations
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "3000"
      prometheus.io/path: "/metrics"
  # -- PodDisruptionBudget configuration
  pdb:
    # -- Enable PodDisruptionBudget
    enabled: false
    # -- Minimum number of pods that must be available
    minAvailable: 1

