  enabled: true
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"


# =============================================================================
# SHARED CONFIGURATION (app and worker)
# ============================================================================
config:
  # -- Log level for the application (DEBUG, INFO, WARNING, ERROR)
  LOGLEVEL:

  # -- PostgreSQL username
  POSTGRES_USER:
  # -- PostgreSQL host address
  POSTGRES_HOST:
  # -- PostgreSQL port
  POSTGRES_PORT:
  # -- PostgreSQL database name
  POSTGRES_DATABASE:

  # -- Message broker type (amqp, redis, pubsub)
  BROKER_TYPE:
  # -- Message broker host address
  BROKER_HOST:
  # -- Message broker username
  BROKER_USER:
  # -- Message broker virtual host (for RabbitMQ)
  BROKER_VHOST:
  # -- Message broker queue name
  BROKER_QUEUE_NAME:
  # -- Summary queue name used by summary tasks and summary worker routing
  BROKER_SUMMARY_QUEUE_NAME: aviator-summaries
  # -- Enable RabbitMQ consistent hash exchange for document-level routing.
  # When enabled, workers are deployed as a StatefulSet with each pod pinned to its own queue.
  BROKER_CONSISTENT_HASH_ENABLED:
  # -- Number of worker queues when using consistent hash exchange (should match worker.replicaCount)
  BROKER_WORKER_QUEUE_COUNT:

  # -- Vector store type (memory, pgvectorstore)
  VECTOR_STORE:
  # -- Vector store table name in PostgreSQL
  VECTOR_STORE_TABLE_NAME:
  # -- Metadata column name in vector store table
  VECTOR_STORE_METADATA_COLUMN:
  # -- Minimum similarity score threshold for vector search results
  VECTOR_SCORE_THRESHOLD:
  # -- Vector storage mode for pgvector (vector, halfvec)
  VECTOR_STORAGE_TYPE:
  # -- ANN index type for pgvector (hnsw, ivfflat). For ivfflat, Aviator derives lists/probes by default.
  VECTOR_INDEX_TYPE:
  # -- HNSW index parameter: max links per node
  HNSW_M:
  # -- HNSW index parameter: construction search depth
  HNSW_EF_CONSTRUCTION:
  # -- Advanced IVFFlat override: number of inverted lists. Leave empty for the default floor(sqrt(total_chunks)).
  IVFFLAT_LISTS:
  # -- Advanced IVFFlat override: probed lists during search. Leave empty for the default floor(sqrt(lists)).
  IVFFLAT_PROBES:

  # -- Enable multi-tenant mode with schema isolation
  MULTI_TENANT_ENABLED:
  # -- Enable the /v1/tenants CRUD REST API (requires MULTI_TENANT_ENABLED!=false)
  TENANT_API_ENABLED:
  # -- Default PostgreSQL schema name
  DEFAULT_SCHEMA:
  # -- Prefix for tenant-specific schemas
  TENANT_SCHEMA_PREFIX:

  # -- Bind address for the API server
  BIND_ADDRESS:
  # -- Bind port for the API server
  BIND_PORT:
  # -- Number of Gunicorn workers
  WORKERS:
  # -- Root path prefix for API endpoints
  ROOT_PATH:

  # -- Content system type for authentication (determines auth handler)
  CONTENT_SYSTEM:
  # -- Content system base URL
  CONTENT_SYSTEM_URL:
  # -- Content system authentication URL
  CONTENT_SYSTEM_AUTH_URL:
  # -- OAuth client ID
  CLIENT_ID:

  # -- Secrets management configuration
  # -- Secrets provider type (environment, google, vault, kubernetes)
  SECRETS_MANAGER:
  # -- Google Cloud project ID for Secret Manager (when SECRETS_MANAGER=google)
  GOOGLE_CLOUD_PROJECT:
  # -- Vault server URL (when SECRETS_MANAGER=vault)
  VAULT_URL:
  # -- Vault configuration JSON (when SECRETS_MANAGER=vault)
  VAULT_CONFIG:
  # -- Kubernetes configuration JSON (when SECRETS_MANAGER=kubernetes)
  KUBERNETES_CONFIG:
  # -- Secret key for PostgreSQL password retrieval
  SECRETS_PGVECTOR_PASSWORD_KEY:

  # -- Add document metadata to RAG context
  ADD_DOC_METADATA_TO_CONTEXT:

  # -- Path to plugin directory
  PLUGIN_PATH:
  # -- UV cache directory for plugin dependencies
  UV_CACHE_DIR:
  # -- Enable development tools
  DEV_TOOLS:

  # -- Checkpointer type for LangGraph state persistence (memory, postgres)
  CHECKPOINTER:
  # -- Hours to retain LangGraph checkpoints before periodic cleanup
  CHECKPOINTER_RETENTION_HOURS:

  # -- Enable conversation message history
  MESSAGE_HISTORY_ENABLED:
  # -- Message history strategy (token_window, summary)
  MESSAGE_HISTORY_STRATEGY:
  # -- Maximum tokens to keep in message history
  MESSAGE_HISTORY_MAX_TOKENS:
  # -- Maximum tokens for message history summary
  MESSAGE_HISTORY_MAX_SUMMARY_TOKENS:

  # -- Enable OpenTelemetry debug tracing
  ENABLE_DEBUG_TRACING:

  # -- LLM model name for general use
  LLM_MODEL:
  # -- LLM model name for assistant/chat use
  LLM_MODEL_ASSISTANT:
  # -- LLM API base URL
  LLM_BASE_URL:
  # -- LLM temperature (0.0 to 1.0)
  LLM_TEMPERATURE:
  # -- LLM provider (google_genai, openai)
  LLM_PROVIDER:
  # -- LLM location/region (for Google AI)
  LLM_LOCATION:
  # -- Top-K sampling parameter
  TOP_K:
  # -- Top-P (nucleus) sampling parameter
  TOP_P:
  # -- Maximum output tokens
  MAX_TOKENS:
  # -- Default limit for RAG query results
  RAG_DEFAULT_LIMIT:

  # -- Embeddings model name
  EMBEDDINGS_MODEL:
  # -- Embeddings API base URL
  EMBEDDINGS_BASE_URL:

  # -- Chunk size for text splitting
  TEXT_SPLITTER_CHUNK_SIZE:
  # -- Chunk overlap for text splitting
  TEXT_SPLITTER_CHUNK_OVERLAP:
  # -- Chunk size for table splitting
  TABLE_SPLITTER_CHUNK_SIZE:
  # -- Chunk overlap for table splitting
  TABLE_SPLITTER_CHUNK_OVERLAP:

# =============================================================================
# OPEN AI
# =============================================================================

  OPENAI_API_KEY:

# =============================================================================
# AZURE OPEN AI
# =============================================================================

  # -- Full Azure OpenAI endpoint URL (optional when instance name is provided)
  AZURE_OPENAI_ENDPOINT:
  # -- Azure OpenAI resource instance name (used to construct endpoint when endpoint is omitted)
  AZURE_OPENAI_INSTANCE_NAME:
  # -- API version for Azure OpenAI requests (for example 2024-10-21)
  AZURE_OPENAI_API_VERSION:
  # -- Deployment name for the primary chat/completions model
  AZURE_OPENAI_DEPLOYMENT_NAME:
  # -- Deployment name for the assistant/chat-specific model
  AZURE_OPENAI_DEPLOYMENT_NAME_ASSISTANT:
  # -- Deployment name for the embeddings model
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT_NAME:

# =============================================================================
# SECRETS
# =============================================================================
secrets:
  # -- Secret keys configuration (environment variables)
  keys:
    # -- Create the secrets resource
    create: false
    # -- Name of the Kubernetes secret
    name: aviator-keys
    # -- Key-value pairs for secret data
    # @default -- {}
    items:
      GOOGLE_APPLICATION_CREDENTIALS: "/secrets/gsa.json"
      # LANGSMITH_API_KEY: "APIKEY"
      # BROKER_PASSWORD: "amqp_password"
      # POSTGRES_PASSWORD: "vector_password"
      # OPENAI_API_KEY: "openai_key"
      # AZURE_OPENAI_API_KEY: azure_openai_key"
      # ...

  # -- Secret files configuration (mounted as files under /secrets in the container)
  files:
    # -- Create the secrets files resource
    create: false
    # -- Name of the Kubernetes secret for files
    name: aviator-files
    # -- File contents (key is filename, value is content)
    # @default -- {}
    items: {}
      # gsa.json: |
      #   { "type": "service_account", ... }
       


# =============================================================================
# INIT CONTAINERS (plugin support)
# =============================================================================
initContainers:
  # -- Plugin volume configuration
  pluginVolume:
    # -- Name of the shared plugin volume
    name: plugin-volume
    # -- Mount path for plugins in containers
    mountPath: /plugins
    # -- Mount as read-only in main container
    readOnly: true
  # -- List of init containers for plugin installation
  # @default -- []
  containers: []
    # Example configuration:
    # - name: plugin-init-ocp
    #   image:
    #     repository: artifactory.otxlab.net/cs-csai-docker-dev
    #     name: aviator-plugin-ocp
    #     tag: latest
    #     pullPolicy: Always

# -- Service account configuration
# serviceAccount:
#   # -- Create a service account
#   create: false
#   # -- Name of the service account to use (if not set, uses chart name)
#   name: "aviator-sa"
serviceAccount:
  enabled: false
  app:
    name: ""
  worker:
    name: ""
  summaryWorker:
    name: ""

volumeMounts:
  gsa:
    mountPath: /secrets
    key: gsa
    path: gsa.json

gcp:
  workloadIdentity:
    # Enable Workload Identity for GKE deployments (no JSON credentials file needed)
    enabled: false
    app: ""
    worker: ""
    summaryWorker: ""

# =============================================================================
# NODE SCHEDULING
# =============================================================================

# -- Node selector for pod scheduling
# @default -- {}
nodeSelector: {}

# -- Tolerations for pod scheduling
# @default -- []
tolerations: []

# -- Affinity rules for pod scheduling
# @default -- {}
affinity: {}

# =============================================================================
# CLOUD SQL PROXY (sidecar)
# =============================================================================
cloudsqlproxy:
  # -- Enable Cloud SQL Proxy sidecar container
  enabled: false
  # -- Cloud SQL Proxy container image
  image: gcr.io/cloud-sql-connectors/cloud-sql-proxy
  # -- Arguments to pass to Cloud SQL Proxy
  arguments:
    - --private-ip
  # -- HTTP endpoint used by the migration Job to signal proxy shutdown.
  # Update this if Cloud SQL Proxy admin bind/port is customized via arguments.
  quitquitUrl: "http://localhost:9091/quitquitquit"
  # -- Cloud SQL instance connection name (format: project:region:instance)
  instanceConnectionName: ""
  # -- Resource requests and limits for Cloud SQL Proxy
  resources:
    requests:
      # -- CPU request
      cpu: "100m"
      # -- Memory request
      memory: "512Mi"
    limits:
      # -- CPU limit
      cpu: 2
      # -- Memory limit
      memory: 1.5Gi

# =============================================================================
# HYBRID DEPLOYMENT INGRESS CONFIGURATION
# =============================================================================

# -- Ingress configuration for the chat service (hybrid deployment)
chat-svc:
  ingress:
    # -- Enable ingress for chat-svc (hybrid deployment)
    enabled: false
    # -- Ingress class name
    class: nginx
    # -- Ingress hostname
    host: ""
    # -- Ingress annotations
    annotations: {}
    # -- TLS configuration
    tls:
      enabled: "false"
      secretName: ""

# -- Ingress configuration for the embed service (hybrid deployment)
embed-svc:
  ingress:
    # -- Enable ingress for embed-svc (hybrid deployment)
    enabled: false
    # -- Ingress class name
    class: nginx
    # -- Ingress hostname
    host: ""
    # -- Ingress annotations
    annotations: {}
    # -- TLS configuration
    tls:
      enabled: "false"
      secretName: ""
