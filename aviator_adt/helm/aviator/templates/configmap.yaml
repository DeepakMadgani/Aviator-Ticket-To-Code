apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aviator.name" . }}-config
data:
{{- if .Values.config }}
{{- range $k, $v := .Values.config }}
{{- if $v }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if or .Values.migration.enabled .Values.summaryMigration.enabled }}
  MIGRATION_ENABLED: "true"
  # Workers need source DB config for offset-based migration
  {{- range $k, $v := .Values.migration.config }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}

