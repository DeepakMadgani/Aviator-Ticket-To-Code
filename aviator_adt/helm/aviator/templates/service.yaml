{{- if .Values.app.enabled -}}
{{- range $serviceName := list "csai-chat-svc" "csai-embed-svc" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $serviceName }}
  namespace: {{ $.Values.namespace }}
spec:
  type: {{ $.Values.app.service.type }}
  selector:
    app: {{ include "aviator.name" $ }}
  ports:
    - name: http
      port: {{ $.Values.app.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- end }}
