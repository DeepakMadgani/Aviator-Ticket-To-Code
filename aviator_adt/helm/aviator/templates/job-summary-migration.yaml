{{- if .Values.summaryMigration.enabled }}
{{- $root := . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aviator.name" . }}-summary-migration-r{{ .Release.Revision }}
  labels:
    app: {{ include "aviator.name" . }}-summary-migration
spec:
  backoffLimit: {{ .Values.summaryMigration.backoffLimit }}
  {{- if .Values.summaryMigration.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ .Values.summaryMigration.ttlSecondsAfterFinished }}
  {{- end }}
  {{- if .Values.summaryMigration.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ .Values.summaryMigration.activeDeadlineSeconds }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ include "aviator.name" . }}-summary-migration
    {{- if .Values.summaryMigration.annotations }}
      annotations:
{{ toYaml .Values.summaryMigration.annotations | nindent 8 }}
    {{- end }}
    spec:
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: {{ .Values.pod.terminationGracePeriodSeconds }}
{{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.serviceAccount.worker.name }}
{{- end }}
{{- if .Values.pod.securityContext.enabled }}
      securityContext:
        runAsUser: {{ .Values.pod.securityContext.runAsUser }}
        runAsGroup: {{ .Values.pod.securityContext.runAsGroup }}
        fsGroup: {{ .Values.pod.securityContext.fsGroup }}
{{- end }}
      initContainers:
        {{- if .Values.summaryMigration.waitForMigration }}
        # Polls migration_state table until chunk migration (id=csai_to_adt) is 'completed'.
        # Ensures summary backfill only starts after all chunks are present in the target DB.
        # Note: If chunk migration is still in progress or failed, this init container will keep retrying
        # and may cause the job to exceed its activeDeadlineSeconds (if set).
        # If init container needs to timeout, set activeDeadlineSeconds or use waitForMigration=false.
        - name: wait-for-chunk-migration
          image: {{ .Values.summaryMigration.waitImage | default "postgres:16-alpine" | quote }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.keys.name }}
                  key: POSTGRES_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for chunk migration (id=csai_to_adt) to reach status=completed…"
              until psql \
                -h "${POSTGRES_HOST}" \
                -U "${POSTGRES_USER:-postgres}" \
                -d "${POSTGRES_DATABASE:-postgres}" \
                -c "SELECT 1 FROM migration_state WHERE id='csai_to_adt' AND status='completed'" \
                | grep -q "1 row"; do
                echo "Chunk migration not yet complete — retrying in 120s"
                sleep 120
              done
              echo "Chunk migration completed — proceeding with summary backfill."
          envFrom:
            - configMapRef:
                name: {{ include "aviator.name" . }}-config
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
        {{- end }}
{{- if (gt (len .Values.initContainers.containers) 0) }}
{{- range $container := .Values.initContainers.containers }}
        - name: {{ $container.name }}
          image: "{{ $container.image.repository }}/{{ $container.image.name }}:{{ $container.image.tag }}"
          imagePullPolicy: {{ $container.image.pullPolicy | default "Always" }}
          volumeMounts:
            - name: {{ $root.Values.initContainers.pluginVolume.name }}
              mountPath: {{ $root.Values.initContainers.pluginVolume.mountPath }}
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
{{- end }}
{{- end }}
      containers:
        {{- if .Values.cloudsqlproxy.enabled }}
        - name: cloud-sql-proxy
          {{- with .Values.cloudsqlproxy }}
          image: {{ .image }}
          command:
            - /cloud-sql-proxy
            {{- toYaml .arguments | nindent 12 }}
            - --quitquit
            - {{ .instanceConnectionName }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
          {{- end }}
        {{- end }}
        - name: {{ include "aviator.name" . }}-summary-migration
          image: "{{ .Values.summaryMigration.image.repository | default .Values.image.repository }}/{{ .Values.summaryMigration.image.name | default .Values.image.name }}:{{ .Values.summaryMigration.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.summaryMigration.image.pullPolicy | default .Values.image.pullPolicy }}
          {{- if .Values.cloudsqlproxy.enabled }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              /aviator_adt/container/entrypoint.sh summary-backfill
              exit_code=$?
              # Signal Cloud SQL Proxy to shut down so the Job pod can terminate.
              curl -s {{ .Values.cloudsqlproxy.quitquitUrl | quote }} || true
              exit $exit_code
          {{- else }}
          args: ["summary-backfill"]
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "aviator.name" . }}-config
            - secretRef:
                name: {{ .Values.secrets.keys.name }}
            {{- if .Values.summaryMigration.secrets.create }}
            - secretRef:
                name: {{ .Values.summaryMigration.secrets.name }}
            {{- end }}
          env:
            # Ensure worker imports summary consumer tasks
            - name: MIGRATION_ENABLED
              value: "true"
            {{- if not .Values.gcp.workloadIdentity.enabled }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "{{ .Values.volumeMounts.gsa.mountPath }}/{{ .Values.volumeMounts.gsa.path }}"
            {{- end }}
            {{- range $k, $v := .Values.summaryMigration.config }}
            {{- if $v }}
            - name: {{ $k }}
              value: "{{ $v }}"
            {{- end }}
            {{- end }}
{{- if and .Values.initContainers.enabled (gt (len .Values.initContainers.containers) 0) }}
            - name: PLUGIN_PATH
              value: "{{ .Values.initContainers.pluginVolume.mountPath }}"
{{- end }}
          resources:
{{ toYaml .Values.summaryMigration.resources | indent 12 }}
          volumeMounts:
            {{- if not .Values.gcp.workloadIdentity.enabled }}
            - name: gsa-credentials
              mountPath: {{ .Values.volumeMounts.gsa.mountPath }}
            {{- end }}
            {{- if and (not .Values.gcp.workloadIdentity.enabled) .Values.secrets.files.create }}
            - name: {{ .Values.secrets.files.name }}
              mountPath: "/secrets"
            {{- end }}
            {{- if (gt (len .Values.initContainers.containers) 0) }}
            - name: {{ .Values.initContainers.pluginVolume.name }}
              mountPath: {{ .Values.initContainers.pluginVolume.mountPath }}
              readOnly: {{ .Values.initContainers.pluginVolume.readOnly }}
            {{- end }}
{{- if .Values.pod.tolerations }}
      tolerations:
{{ toYaml .Values.pod.tolerations | indent 8 }}
{{- end }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      volumes:
        {{- if not .Values.gcp.workloadIdentity.enabled }}
        - name: gsa-credentials
          secret:
            secretName: {{ .Values.secrets.files.name }}
            items:
              - key: {{ .Values.volumeMounts.gsa.key }}
                path: {{ .Values.volumeMounts.gsa.path }}
        {{- end }}
        {{- if and (not .Values.gcp.workloadIdentity.enabled) .Values.secrets.files.create }}
        - name: {{ .Values.secrets.files.name }}
          secret:
            secretName: {{ .Values.secrets.files.name }}
        {{- end }}
        {{- if (gt (len .Values.initContainers.containers) 0) }}
        - name: {{ .Values.initContainers.pluginVolume.name }}
          emptyDir: {}
        {{- end }}
{{- end }}
