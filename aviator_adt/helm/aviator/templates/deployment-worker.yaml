{{- if .Values.worker.enabled }}
{{- $root := . -}}
{{- $hashEnabled := eq (default "" (printf "%v" (index .Values.config "BROKER_CONSISTENT_HASH_ENABLED"))) "true" -}}
apiVersion: apps/v1
{{- if $hashEnabled }}
kind: StatefulSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  name: {{ include "aviator.name" . }}-worker
spec:
{{- if $hashEnabled }}
  replicas: {{ index .Values.config "BROKER_WORKER_QUEUE_COUNT" }}
{{- else }}
  replicas: {{ .Values.worker.replicaCount }}
{{- end }}
{{- if $hashEnabled }}
  serviceName: {{ include "aviator.name" . }}-worker
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
{{- else }}
{{- if .Values.worker.strategy }}
  strategy:
{{ toYaml .Values.worker.strategy | indent 4 }}
{{- end }}
{{- end }}
  selector:
    matchLabels:
      app: {{ include "aviator.name" . }}-worker
  template:
    metadata:
      labels:
        app: {{ include "aviator.name" . }}-worker
      annotations:
{{ toYaml .Values.worker.annotations | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.pod.terminationGracePeriodSeconds }}
{{- if .Values.serviceAccount.enabled }}
      serviceAccountName: {{ .Values.serviceAccount.worker.name }}
{{- end }}
{{- if .Values.pod.securityContext.enabled }}
      securityContext:
        runAsUser: {{ .Values.pod.securityContext.runAsUser }}
        runAsGroup: {{ .Values.pod.securityContext.runAsGroup }}
        fsGroup: {{ .Values.pod.securityContext.fsGroup }}
{{- end }}
{{- if (gt (len .Values.initContainers.containers) 0) }}
      initContainers:
{{- range $container := .Values.initContainers.containers }}
        - name: {{ $container.name }}
          image: "{{ $container.image.repository }}/{{ $container.image.name }}:{{ $container.image.tag }}"
          imagePullPolicy: {{ $container.image.pullPolicy | default "Always" }}
          volumeMounts:
            - name: {{ $root.Values.initContainers.pluginVolume.name }}
              mountPath: {{ $root.Values.initContainers.pluginVolume.mountPath }}
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
{{- end }}
{{- end }}
      containers:
        {{- if .Values.cloudsqlproxy.enabled }}
        - name: cloud-sql-proxy
          {{- with .Values.cloudsqlproxy }}
          image: {{ .image }}
          command:
            - /cloud-sql-proxy
            {{- toYaml .arguments | nindent 12 }}
            - {{ .instanceConnectionName }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
          {{- end }}
        {{- end }}
        - name: {{ include "aviator.name" . }}-worker
          image: "{{ .Values.worker.image.repository | default .Values.image.repository }}/{{ .Values.worker.image.name | default .Values.image.name }}:{{ .Values.worker.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy | default .Values.image.pullPolicy }}
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: {{ include "aviator.name" . }}-config
            - secretRef:
                name: {{ .Values.secrets.keys.name }}
            {{- if and (or .Values.migration.enabled .Values.summaryMigration.enabled) .Values.migration.secrets.create }}
            # Workers need source DB credentials for offset-based migration
            - secretRef:
                name: {{ .Values.migration.secrets.name }}
            {{- end }}
          env:
            {{- if not .Values.gcp.workloadIdentity.enabled }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "{{ .Values.volumeMounts.gsa.mountPath }}/{{ .Values.volumeMounts.gsa.path }}"
            {{- end }}
            - name: CELERY_WORKER_ROLE
              value: "{{ .Values.worker.workerRole }}"
            - name: WORKER_AUTOSCALE
              value: "{{ .Values.worker.threads }}"
            - name: WORKER_QUEUE_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
{{- if and .Values.initContainers.enabled (gt (len .Values.initContainers.containers) 0) }}
            - name: PLUGIN_PATH
              value: "{{ .Values.initContainers.pluginVolume.mountPath }}"
{{- end }}
          resources:
{{ toYaml .Values.worker.resources | indent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.service.port }}
          volumeMounts:
            {{- if not .Values.gcp.workloadIdentity.enabled }}
              {{- if .Values.secrets.files.create }}
            - name: {{ .Values.secrets.files.name }}
              mountPath: {{ .Values.volumeMounts.gsa.mountPath }}
              {{- else }}
            - name: gsa-credentials
              mountPath: {{ .Values.volumeMounts.gsa.mountPath }}
              {{- end }}
            {{- end }}
            {{- if (gt (len .Values.initContainers.containers) 0) }}
            - name: {{ .Values.initContainers.pluginVolume.name }}
              mountPath: {{ .Values.initContainers.pluginVolume.mountPath }}
              readOnly: {{ .Values.initContainers.pluginVolume.readOnly }}
            {{- end }}
{{- if .Values.worker.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - /probes/worker-readiness.py
            initialDelaySeconds: {{ .Values.worker.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.probes.readiness.failureThreshold }}
{{- end }}
{{- if .Values.worker.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - /probes/worker-liveness.py
            initialDelaySeconds: {{ .Values.worker.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.probes.liveness.failureThreshold }}
{{- end }}
{{- if .Values.worker.probes.startup.enabled }}
          startupProbe:
            exec:
              command:
                - /probes/worker-startup.py
            initialDelaySeconds: {{ .Values.worker.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.worker.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.worker.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.worker.probes.startup.failureThreshold }}
{{- end }}
{{- if .Values.pod.tolerations }}
      tolerations:
{{ toYaml .Values.pod.tolerations | indent 8 }}
{{- end }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      volumes:
        {{- if not .Values.gcp.workloadIdentity.enabled }}
          {{- if .Values.secrets.files.create }}
        - name: {{ .Values.secrets.files.name }}
          secret:
            secretName: {{ .Values.secrets.files.name }}
          {{- else }}
        - name: gsa-credentials
          secret:
            secretName: {{ .Values.secrets.files.name }}
            items:
              - key: {{ .Values.volumeMounts.gsa.key }}
                path: {{ .Values.volumeMounts.gsa.path }}
          {{- end }}
        {{- end }}
        {{- if (gt (len .Values.initContainers.containers) 0) }}
        - name: {{ .Values.initContainers.pluginVolume.name }}
          emptyDir: {}
        {{- end }}
{{- end }}
