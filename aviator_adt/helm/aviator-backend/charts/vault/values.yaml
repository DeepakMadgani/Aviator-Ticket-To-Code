# Default values for vault.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: artifactory.otxlab.net/dockerhub/hashicorp/vault
  tag: "1.14"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8200

environment:
  - name: VAULT_DEV_ROOT_TOKEN_ID
    value: "password"
  - name: VAULT_DEV_LISTEN_ADDRESS
    value: "0.0.0.0:8200"
  - name: VAULT_DISABLE_MLOCK
    value: "true"

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Vault specific configurations
vault:
  dev: true

# RBAC configuration for Kubernetes authentication
rbac:
  # Create RBAC resources for Vault Kubernetes authentication
  # Required when using Vault Kubernetes auth method in real clusters
  create: false
  
  # ClusterRole configuration
  clusterRole:
    # Name of the ClusterRole
    name: ""  # If empty, generates name using helm template
    
    # Additional rules to add to the ClusterRole
    extraRules: []
  
  # ClusterRoleBinding configuration  
  clusterRoleBinding:
    # Name of the ClusterRoleBinding
    name: ""  # If empty, generates name using helm template
    
    # Additional subjects for the ClusterRoleBinding
    extraSubjects: []