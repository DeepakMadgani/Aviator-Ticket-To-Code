{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vault.rbac.clusterRoleBindingName" . }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vault.rbac.clusterRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "vault.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- with .Values.rbac.clusterRoleBinding.extraSubjects }}
# Additional subjects
{{- toYaml . | nindent 0 }}
{{- end }}
{{- end }}