# Default values for rabbitmq.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: artifactory.otxlab.net/cs-csai-docker-dev/rabbitmq
  pullPolicy: IfNotPresent
  tag: "4.0.6-management"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  ports:
    management: 15672
    amqp: 5672

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  tcpSocket:
    port: amqp
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  tcpSocket:
    port: amqp
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# RabbitMQ specific configuration
rabbitmq:
  # Default username and password
  auth:
    username: "user"
    password: "secretpassword"
    existingPasswordSecret: ""
    existingErlangSecret: ""
  
  # Environment variables
  environment:
    RABBITMQ_CONFIG_FILE: "rabbitmq-1.conf"
    RABBITMQ_PLUGINS: "rabbitmq_management rabbitmq_consistent_hash_exchange"
  
  # Configuration file content
  config: |
    ## Default user
    default_user = user
    default_pass = secretpassword
    
    ## Management plugin
    management.tcp.port = 15672
    
    ## AMQP port
    listeners.tcp.default = 5672
    
    ## Disk free limit
    disk_free_limit.absolute = 2GB
    
    ## Memory high watermark
    vm_memory_high_watermark.relative = 0.4
    
    ## Maximum message size (16MB)
    max_message_size = 16777216
  
  # Enabled plugins file content
  enabledPlugins: |
    [rabbitmq_management, rabbitmq_consistent_hash_exchange].

# Persistence
persistence:
  enabled: true
  # storageClass: ""
  accessMode: ReadWriteOnce
  size: 8Gi