services:
  aviator:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    command: sleep infinity
    ports:
      - "3000:3000"
    user: "1000:1000"

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ..:/aviator_adt:cached
      - home:/home/vscode
      - uv-venv:/aviator_adt/.venv

    restart: unless-stopped
 
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  pubsub:
    image: artifactory.otxlab.net/dockerhub/singularities/pubsub-emulator
    environment:
      - PUBSUB_PROJECT_ID=aviator-dev
      - PUBSUB_LISTEN_ADDRESS=0.0.0.0:8432
    ports:
      - "8432:8432"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8432/v1/projects/aviator-dev/topics"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  pgdata:
  rabbitmq_data:
  home:
  uv-venv: